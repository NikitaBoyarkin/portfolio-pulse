[project]
name = "portfolio-pulse"
version = "0.1.0"
description = "A zero-dollar data stack over my own GitHub portfolio: dlt, DuckDB, dbt, GitHub Actions, Streamlit"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlt[duckdb,motherduck]>=1.32",
    "dbt-duckdb>=1.11",
    "duckdb>=1.1",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
