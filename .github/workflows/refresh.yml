name: Refresh data

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The default GITHUB_TOKEN authenticates as a bot: it sees one repo and no
      # contributions. A user PAT (public repos, read-only) is required.
      GITHUB_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
      DESTINATION: duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Require PORTFOLIO_TOKEN
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Secret PORTFOLIO_TOKEN is not set. Create a fine-grained PAT (public repos, read-only) and add it as PORTFOLIO_TOKEN."
            exit 1
          fi
      - run: uv sync --all-groups
      - run: make ingest
      - run: make transform
      - run: make test
      - name: Publish marts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts
          git diff --staged --quiet || git commit -m "data: refresh marts [skip ci]"
          git push
